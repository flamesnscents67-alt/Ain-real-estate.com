<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a quote</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Figtree:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"></head><body><header class="top" id="top"></header>
<main><section class="s"><div class="wrap"><h1>Request a quote</h1><p>Pick a house and leave your details. We will get back to you.</p>
<form class="f" id="f"><label>Your name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" required maxlength="200"></label><label>Phone<input name="phone" type="tel" maxlength="40"></label>
<label>House<select name="listing_id" id="sel"><option value="">Select a house</option></select></label><label>Message<textarea name="message" rows="4" maxlength="2000"></textarea></label>
<button class="btn red">Send quote request</button><div class="out"></div></form></div></section></main>
<footer class="foot" id="foot"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>chrome('quote');handleForm(document.getElementById('f'),'quote',true);
sb.from('listings').select('id,title,location').eq('status','available').order('created_at',{ascending:false}).then(({data})=>{const s=document.getElementById('sel');(data||[]).forEach(l=>s.add(new Option(l.title+' - '+l.location,l.id)));const p=new URLSearchParams(location.search).get('listing');if(p)s.value=p});</script>
</body></html>
